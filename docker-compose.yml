version: '3.7'

services:
  frontend:
    container_name: "frontend"
    build: ./frontend/.
    ports:
      - '3000:3000'
    networks:
      - mynetwork
    depends_on:
      - redis
      - mysqldb
      - backend
      - worker-server
    volumes:
      - frontend_logs:/app/logs   # example: store logs

  backend:
    container_name: "backend"
    build: ./backend/.
    environment:
      - PORT=5001
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_CHANNEL=${REDIS_CHANNEL}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USERNAME=${MYSQL_USERNAME}
      - MYSQL_PASSWORD_FILE=/run/secrets/mysql_password
      - MYSQL_TABLE=${MYSQL_TABLE}
    ports:
      - '5001:5001'
    networks:
      - mynetwork
    depends_on:
      - mysqldb
      - redis
      - worker-server
    secrets:
      - redis_password
      - mysql_password
    volumes:
      - backend_logs:/app/logs   # example: logs
      - backend_uploads:/app/uploads  # example: user uploads

  worker-server:
    container_name: "worker-server"
    build: ./worker-server/.
    environment:
      - PORT=5002
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_CHANNEL=${REDIS_CHANNEL}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USERNAME=${MYSQL_USERNAME}
      - MYSQL_PASSWORD_FILE=/run/secrets/mysql_password
      - MYSQL_TABLE=${MYSQL_TABLE}
    networks:
      - mynetwork
    depends_on:
      - mysqldb
      - redis
    secrets:
      - redis_password
      - mysql_password
    volumes:
      - worker_logs:/app/logs

  mysqldb:
    container_name: "mysqldb"
    build: ./mysqldb/.
    environment:
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/mysql_root_password
    networks:
      - mynetwork
    secrets:
      - mysql_root_password
    volumes:
      - mysql_data:/var/lib/mysql   # persist DB files

  redis:
    container_name: "redis-db"
    image: "redis:latest"
    command: >
      sh -c "exec redis-server --save 20 1 --loglevel warning
      --requirepass $$(cat /run/secrets/redis_password)"
    networks:
      - mynetwork
    secrets:
      - redis_password
    volumes:
      - redis_data:/data   # persist Redis cache

networks:
  mynetwork:
    driver: bridge

secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password.txt
  mysql_password:
    file: ./secrets/mysql_password.txt
  redis_password:
    file: ./secrets/redis_password.txt

volumes:
  mysql_data:
  redis_data:
  frontend_logs:
  backend_logs:
  backend_uploads:
  worker_logs:
